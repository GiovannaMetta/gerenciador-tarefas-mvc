<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil do Usuário - Padrão MVC</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-xl shadow-md overflow-hidden p-6 text-center">
        <h1 class="text-2xl font-bold text-slate-900 mb-2">Meu Perfil</h1>
        <p class="text-sm text-slate-500 mb-6">Informações da sua conta cadastrada</p>

        <div class="bg-slate-50 p-4 rounded-lg border border-slate-200 mb-6 text-left">
            <p class="text-sm font-medium text-slate-600">Nome: <span class="font-normal text-slate-800">Usuário Padrão</span></p>
            <p class="text-sm font-medium text-slate-600 mt-2">E-mail: <span class="font-normal text-slate-800">usuario@email.com</span></p>
        </div>

        <a href="/" class="inline-block bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-lg transition">
            Voltar para as Tarefas
        </a>
    </div>

</body>
</html>
